name: Tests

on:
  pull_request:
    branches:
      - dev

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Lint
        run: |
          npm install
          npm run lint

  tests:
    name: Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Tests
        run: |
          npm install
          npm test

      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            test-report/test-report.html

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/cobertura-coverage.xml
          fail_below_min: true
          thresholds: '45 60'
          indicators: true

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-22.04
    needs: tests
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install dependencies
        run: npm ci

      - name: Run UI Tests (ExTester)
        run: xvfb-run -a npm run test:ui

      - name: Upload UI test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-artifacts
          path: |
            test-resources/screenshots
            /tmp/test-resources/screenshots
            extest.log
          if-no-files-found: ignore

