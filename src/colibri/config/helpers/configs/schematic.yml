docLink: "https://terostechnology.github.io/terosHDLdoc/docs/guides/schematic_viewer/installation"

backend:
  description: "Select the backend:"
  type: select
  options:
    yowasp: "YoWASP (Only Verilog/SV)"
    yosys: "Yosys (Only Verilog/SV)"
    yosys_ghdl: "GHDL + Yosys (VHDL+Verilog/SV)"
    standalone: "Standalone (Verilog/SV)"
  value: "yowasp"

extra:
  description: "Extra options passed before to run yowasp-yosys or yosys. Eg: 'conda activate base & ' or 'C:/OSS-CAD-SUITE/oss-cad-suite/start.bat & '" 
  type: string
  value: ""

args:
  description: "Arguments passed to Yosys"
  type: string
  value: ""

args_ghdl:
  description: "Arguments passed to GHDL"
  type: string
  value: ""

ignorePaths:
  description: "Paths of files to exclude from the schematic viewer: matching files are not passed to Yosys. Comma separated files or glob patterns. Example: '/home/myuser/firmware/sources/ip_cores/sim/*.vhdl'"
  type: array
  value: []

libraries:
  description: "Additional libraries passed to Yosys. Each row reads the files of the given path (a file or a glob pattern) into the library with the given name, so e.g. 'library UNISIM;' is resolved by the GHDL + Yosys backend. Example: name 'UNISIM', path '/opt/Xilinx/Vivado/2024.2/data/vhdl/src/unisims/unisim_retarget_VCOMP.vhd'"
  type: table
  columns:
    - name
    - path
  value: []