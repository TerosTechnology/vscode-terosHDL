select_tool:
  description: "Select a tool, framework, simulator..."
  type: select
  options:
    osvvm: "OSVVM"
    vunit: "VUnit"
    ghdl: "GHDL"
    cocotb: "cocotb"
    icarus: "Icarus"
    icestorm: "Icestorm"
    ise: "ISE"
    isim: "ISIM"
    modelsim: "ModelSim"
    openfpga: "OpenFPGA"
    quartus: "Quartus"
    rivierapro: "Riviera-PRO"
    spyglass: "SpyGlass"
    trellis: "Trellis"
    vcs: "VCS"
    verilator: "Verilator"
    vivado: "Vivado"
    xcelium: "Xcelium"
    xsim: "XSIM"
    raptor: "Raptor Design Suite"
    radiant: "Radiant"
    sandpiper: "SandPiper"
    yosys: "Yosys"

  value: "ghdl"

manual_compilation_order:
  description: "Path to the file with the manual compilation order."
  type: string
  value: ""

execution_mode:
  description: "Select the execution mode."
  type: select
  options:
    gui: "GUI"
    cmd: "Command line"
  value: "cmd"

waveform_viewer:
  description: "Select the waveform viewer. For GTKWave/Surfer you need to install it."
  type: select
  options:
    tool: "Tool GUI"
    vaporView: "VaporView"
    gtkwave: "GTKWave"
    surfer: "Surfer"
  value: "tool"

vaporview_import_signals:
  description: "Import signals automatically in VaporView."
  type: boolean
  value: true

gtkwave_installation_path:
  description: "GTKWave installation directory."
  type: string
  value: ""

gtkwave_extra_arguments:
  description: "Extra arguments passed to GTKwave. E.g: --script=script.tcl"
  type: string
  value: ""

surfer_installation_path:
  description: "Surfer installation directory."
  type: string
  value: ""

surfer_extra_arguments:
  description: "Extra arguments passed to Surfer. E.g: --script=script.tcl"
  type: string
  value: ""